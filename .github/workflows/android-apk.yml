name: Build Android APK

on:
  push:
    branches:
      - arena/376b021e-budget-sheet
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies and sync Android project
        run: |
          npm ci
          npm run android:sync
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ledger-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish first APK release
        if: contains(github.event.head_commit.message, '[publish-apk]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 "android/app/build/outputs/apk/debug/app-debug.apk#Pocket-Ledger-v1.0.0-debug.apk" \
            --target "$GITHUB_SHA" \
            --title "Pocket Ledger v1.0.0" \
            --notes "First Android build of Pocket Ledger.

          Download the APK below and install it on an Android device running Android 6.0 or later. You may need to allow installation from your browser or file manager.

          This is a debug-signed APK for testing and personal use, not a production-signed Play Store release. Future builds may not be upgrade-compatible. Budget data is stored on the device; uninstalling the app or clearing its data can remove it."
